<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">תל דן — מעיין, עיר ודרך</title>
<desc id="desc">תרשים סכמטי של תל דן בצפון עמק החולה, המציג את מעיין דן, נחל דן, התל, השער הכנעני והשער הישראלי, ואת כיוון הזרימה אל הירדן.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#e4ddce"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa7a0"/><stop offset="1" stop-color="#315f64"/></linearGradient>
  <linearGradient id="mound" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8a66f"/><stop offset="1" stop-color="#8c714d"/></linearGradient>
  <pattern id="contours" width="160" height="120" patternUnits="userSpaceOnUse"><path d="M-20 55 C25 5 95 5 180 55 M-20 80 C25 30 95 30 180 80 M-20 105 C25 55 95 55 180 105" fill="none" stroke="#a9a18f" stroke-width="1.2" opacity=".38"/></pattern>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#315f64" stroke-width="1.7"/></marker>
</defs>
<rect width="1400" height="900" fill="url(#paper)"/>
<rect width="1400" height="900" fill="url(#contours)" opacity=".75"/>
<text x="700" y="82" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="34" font-weight="700" fill="#20251f">תל דן: עיר שנבנתה ליד מים</text>
<text x="700" y="122" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="17" fill="#74756c">תרשים עקרוני של הקשר בין המעיין, התל והדרך אל הירדן — לא מפה בקנה מידה</text>
<path d="M190 195 C265 240 300 290 340 345 C390 415 425 485 510 530 C620 588 760 570 860 625 C965 682 1080 730 1230 760" fill="none" stroke="#7aa7a0" stroke-width="66" stroke-linecap="round" opacity=".35"/>
