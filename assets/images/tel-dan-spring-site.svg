<text x="194" y="302" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="13" fill="#53605a">מקור מים קארסטי</text>
<text x="700" y="692" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" fill="#315f64">נחל דן — זרימה דרומה אל מערכת הירדן</text>
