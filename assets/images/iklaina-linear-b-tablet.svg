  <text x="345" y="78" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#596259">ארמון נסטור · ארכיון גדול</text>
  <path d="M50 214H340" stroke="#b8aa94" stroke-width="3"/>
  <path d="M65 211V142H326V211M92 142V113H299V142M112 113V94H279V113" fill="none" stroke="#294638" stroke-width="8"/>
