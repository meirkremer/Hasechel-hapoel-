  <text x="600" y="427" text-anchor="middle" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="17" font-weight="600" fill="#8c4935">איחוד מאוחר?</text>
</g>
<g transform="translate(475 485)">
