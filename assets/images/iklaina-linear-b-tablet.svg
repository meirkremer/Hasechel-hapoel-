<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">איקליינה וארמון נסטור: שני מרכזים לפני ממלכת פילוס</title>
<desc id="desc">תרשים מושגי המציג שני מרכזי יישוב מיקניים, לוח חרס קטן בכתב לינאר B, וקשר מדיני אפשרי של איחוד מאוחר ביניהם.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f1e7"/><stop offset="1" stop-color="#e9e1d2"/></linearGradient>
  <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8b987"/><stop offset="1" stop-color="#b98754"/></linearGradient>
  <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#a98d69" opacity=".16"/><circle cx="13" cy="12" r=".8" fill="#a98d69" opacity=".14"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a34e36"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#paper)"/>
<rect width="1200" height="760" fill="url(#grain)"/>
<text x="1100" y="82" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="22" letter-spacing="2" fill="#8a6d3b">היסטוריה של מוסדות ושלטון</text>
<text x="1100" y="145" text-anchor="end" direction="rtl" font-family="Noto Serif Hebrew,Georgia,serif" font-size="48" font-weight="600" fill="#20251f">שני מרכזים, ממלכה אחת?</text>
<path d="M100 178H1100" stroke="#cfc5b3" stroke-width="2"/>
<g transform="translate(90 230)">
