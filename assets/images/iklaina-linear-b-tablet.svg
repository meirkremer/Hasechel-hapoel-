<text x="600" y="638" text-anchor="middle" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="19" fill="#3b463d">שבר לוח בכתב לינאר B: סימן הברתי אחד בכל צד, וסימנים שאולי הם מספרים</text>
<path d="M100 677H1100" stroke="#cfc5b3" stroke-width="2"/>
<text x="1100" y="714" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#6e756c">התרשים מציג מודל אפשרי בלבד — לא מפה ולא שחזור ארכאולוגי</text>
