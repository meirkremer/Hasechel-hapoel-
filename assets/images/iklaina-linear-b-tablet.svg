  <text x="345" y="48" text-anchor="end" direction="rtl" font-family="Noto Serif Hebrew,Georgia,serif" font-size="32" fill="#f3efe6">איקליינה</text>
  <text x="345" y="78" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#d7d2c6">מרכז יישוב מיקני</text>
  <path d="M54 214H332" stroke="#aeb9a8" stroke-width="3" opacity=".65"/>
  <path d="M75 211V155L105 126L136 155V211M149 211V139L183 107L216 139V211M230 211V164L260 136L291 164V211" fill="none" stroke="#e3d6bd" stroke-width="8" stroke-linejoin="round"/>
