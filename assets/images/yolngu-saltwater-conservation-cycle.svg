<text x="900" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#294638">השימור מחזיר אחריות אל הקהילה</text>
<text x="600" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#66736b">המחזור מתאר יחסי ידע וסמכות, לא שרשרת ייצור ליניארית</text>
