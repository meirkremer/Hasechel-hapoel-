<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">מן הארץ אל המוזיאון: מחזור הידע והשימור של ציורי Saltwater</title>
<desc id="desc">תרשים מושגי בארבעה שלבים: קשרי קהילה וארץ ים, יצירת ציור על קליפה, הצגת ידע בהליך משפטי, ושימור במוזיאון בשיתוף הקהילה. התרשים אינו כולל דגמים חמולתיים או סמלים מקודשים.</desc>
