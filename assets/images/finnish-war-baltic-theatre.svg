<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">זירת המלחמה הפינית, 1808–1809</title>
<desc id="desc">תרשים סכמטי המציג את שוודיה ממערב, פינלנד ממזרח, מפרץ בוטניה ביניהן, ואת מסלולי ההתקדמות הרוסיים בפינלנד ובמעבר הקרח באזור קוורקן.</desc>
