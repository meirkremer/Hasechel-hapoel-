<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">עקומות זמן הגעה של גלים סייסמיים</title>
<desc id="desc">גרף עקרוני המראה שגל ישיר בקרום וגל הנשבר דרך שכבה עמוקה ומהירה מצטלבים: במרחקים גדולים המסלול העמוק עשוי להגיע מוקדם יותר.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f3ea"/><stop offset="1" stop-color="#e9e3d7"/></linearGradient>
  <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#a34e36" stroke-width="1.5"/></marker>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#294638" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<text x="600" y="62" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="31" font-weight="700" fill="#20251f">כשהדרך הארוכה מגיעה ראשונה</text>
<text x="600" y="101" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="17" fill="#74756c">זמן הגעה כפונקציה של המרחק מן הרעידה — המחשה עקרונית</text>
<g stroke="#c9c1b3" stroke-width="1">
  <line x1="160" y1="170" x2="160" y2="565"/>
  <line x1="160" y1="565" x2="1050" y2="565"/>
  <line x1="160" y1="466" x2="1050" y2="466" stroke-dasharray="4 8"/>
  <line x1="160" y1="367" x2="1050" y2="367" stroke-dasharray="4 8"/>
  <line x1="160" y1="268" x2="1050" y2="268" stroke-dasharray="4 8"/>
  <line x1="382" y1="170" x2="382" y2="565" stroke-dasharray="4 8"/>
  <line x1="604" y1="170" x2="604" y2="565" stroke-dasharray="4 8"/>
  <line x1="826" y1="170" x2="826" y2="565" stroke-dasharray="4 8"/>
</g>
<g font-family="Heebo,Arial,sans-serif" font-size="16" fill="#74756c">
  <text x="140" y="570" text-anchor="end">0</text>
  <text x="140" y="471" text-anchor="end">20</text>
  <text x="140" y="372" text-anchor="end">40</text>
  <text x="140" y="273" text-anchor="end">60</text>
  <text x="140" y="174" text-anchor="end">80</text>
  <text x="160" y="600" text-anchor="middle">0</text>
  <text x="382" y="600" text-anchor="middle">100</text>
  <text x="604" y="600" text-anchor="middle">200</text>
  <text x="826" y="600" text-anchor="middle">300</text>
  <text x="1050" y="600" text-anchor="middle">400</text>
</g>
<text x="600" y="646" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" fill="#20251f">מרחק מן המוקד (קילומטרים)</text>
<text x="58" y="375" transform="rotate(-90 58 375)" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" fill="#20251f">זמן הגעה (שניות)</text>
<path d="M160 565 L1050 188" fill="none" stroke="#a34e36" stroke-width="7" stroke-linecap="round"/>
<path d="M160 450 L1050 300" fill="none" stroke="#294638" stroke-width="7" stroke-linecap="round"/>
<circle cx="604" cy="377" r="10" fill="#c5a16b" stroke="#20251f" stroke-width="3"/>
<path d="M604 377 L604 565" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="665" y="177" width="355" height="70" rx="3" fill="#f3efe6" stroke="#d5cec0"/>
<text x="842" y="207" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" font-weight="700" fill="#294638">מסלול דרך שכבה עמוקה ומהירה</text>
<text x="842" y="231" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="15" fill="#74756c">שיפוע קטן יותר = מהירות גבוהה יותר</text>
<path d="M800 252 L770 310" fill="none" stroke="#294638" stroke-width="2" marker-end="url(#arr2)"/>
<rect x="210" y="290" width="310" height="70" rx="3" fill="#f3efe6" stroke="#d5cec0"/>
<text x="365" y="320" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" font-weight="700" fill="#a34e36">מסלול ישיר בקרום</text>
<text x="365" y="344" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="15" fill="#74756c">מהירות נמוכה יותר</text>
<path d="M500 360 L540 405" fill="none" stroke="#a34e36" stroke-width="2" marker-end="url(#arr1)"/>
<rect x="655" y="425" width="365" height="55" rx="3" fill="#f3efe6" stroke="#d5cec0"/>
<text x="837" y="459" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="17" font-weight="700" fill="#20251f">נקודת מעבר: המסלול המהיר מקדים</text>
<path d="M655 451 L610 387" stroke="#8a6d3b" stroke-width="2" fill="none"/>
<text x="600" y="680" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="13" fill="#74756c">הקווים והערכים סכמטיים בלבד; אין מדובר במדידות רעידת 1909</text>
</svg>