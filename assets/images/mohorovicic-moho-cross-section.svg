<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">חתך סכמטי של הקרום, המוהו והמעטפת</title>
<desc id="desc">המחשה של קרום כדור הארץ מעל המעטפת העליונה, גבול המוהו ושני מסלולים אפשריים של גל סייסמי.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f3ea"/><stop offset="1" stop-color="#e9e3d7"/></linearGradient>
  <linearGradient id="mantle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8da18a"/><stop offset="1" stop-color="#536d5b"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#a34e36" stroke-width="1.5"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#294638" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="700" fill="url(#paper)"/>
<text x="600" y="62" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="31" font-weight="700" fill="#20251f">מה מסתתר מתחת לקרום?</text>
<text x="600" y="101" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="17" fill="#74756c">חתך עקרוני — לא בקנה מידה</text>
<path d="M70 220 C210 198 310 205 420 214 C520 224 650 214 760 207 C900 198 1030 205 1130 218 L1130 330 C1010 315 900 320 760 325 C620 330 520 330 420 319 C290 309 190 314 70 328 Z" fill="#c5a16b" stroke="#8e7049" stroke-width="2"/>
<path d="M70 328 C190 314 290 309 420 319 C520 330 620 330 760 325 C900 320 1010 315 1130 330 L1130 630 L70 630 Z" fill="url(#mantle)"/>
<path d="M70 328 C190 314 290 309 420 319 C520 330 620 330 760 325 C900 320 1010 315 1130 330" fill="none" stroke="#294638" stroke-width="5" stroke-dasharray="12 7"/>
<text x="300" y="265" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="24" font-weight="700" fill="#4a3a27">קרום כדור הארץ</text>
<text x="900" y="500" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="30" font-weight="700" fill="#f3efe6">המעטפת העליונה</text>
<rect x="790" y="344" width="310" height="46" rx="2" fill="#f3efe6" opacity=".94"/>
<text x="945" y="374" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="22" font-weight="700" fill="#294638">גבול המוהו</text>
<path d="M190 225 Q600 195 1015 225" fill="none" stroke="#a34e36" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M190 225 Q380 395 620 352 Q780 330 1015 225" fill="none" stroke="#294638" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<circle cx="190" cy="225" r="11" fill="#a34e36" stroke="#f3efe6" stroke-width="4"/>
<circle cx="1015" cy="225" r="11" fill="#294638" stroke="#f3efe6" stroke-width="4"/>
<text x="175" y="180" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="19" font-weight="700" fill="#a34e36">מוקד רעידה</text>
<text x="1015" y="180" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="19" font-weight="700" fill="#294638">תחנת מדידה</text>
<text x="600" y="195" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" fill="#a34e36">מסלול ישיר</text>
<text x="672" y="438" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="18" fill="#f3efe6">מסלול שבור</text>
<text x="600" y="665" text-anchor="middle" direction="rtl" font-family="Heebo,Arial,sans-serif" font-size="15" fill="#74756c">הגל העובר בשכבה העמוקה והמהירה עשוי להגיע ראשון לתחנה רחוקה</text>
</svg>