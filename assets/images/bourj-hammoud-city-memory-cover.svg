<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">המחשה של רחוב בבורג' חמוד</title>
<desc id="desc">רחוב עירוני צפוף ובו בנייני מגורים, מרפסות, חוטי חשמל ושלטים הנושאים שמות של עיירות ארמניות היסטוריות.</desc>
