<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">הפיזיקה והניקוד של קפיצת החלקה</title>
<desc id="desc">תרשים לימודי מקורי המציג שלושה שלבים בקפיצה — המראה, סיבוב באוויר ונחיתה — ולצדם השוואה בין רכיבי הניקוד של מדבדבה וזגיטובה בתוכנית החופשית באולימפיאדת 2018.</desc>
<rect width="1200" height="760" fill="#eee8dc"/><text x="1120" y="62" text-anchor="end" font-family="Heebo,Arial,sans-serif" font-size="26" fill="#294638" font-weight="700">מה הגוף עושה — ומה השופטים רואים?</text><path d="M60 92H1140" stroke="#c5a16b" stroke-width="2"/>
<g font-family="Heebo,Arial,sans-serif">
<g transform="translate(70 125)"><rect width="320" height="300" rx="18" fill="#e1dccf" stroke="#d0c8b8"/><text x="160" y="38" text-anchor="middle" font-size="21" fill="#a34e36" font-weight="700">01 · המראה</text><path d="M35 240H285" stroke="#9ba9a0" stroke-width="3"/><circle cx="157" cy="95" r="19" fill="#a34e36"/><path d="M148 119L127 183L177 195L178 129Z" fill="#294638"/><path d="M141 132L91 107M170 134L216 99" stroke="#294638" stroke-width="13" stroke-linecap="round"/><path d="M140 187L98 237M169 192L221 225" stroke="#294638" stroke-width="14" stroke-linecap="round"/><path d="M76 242L126 242" stroke="#a34e36" stroke-width="5" stroke-linecap="round"/><path d="M230 225L265 231" stroke="#a34e36" stroke-width="5" stroke-linecap="round"/><path d="M60 218Q91 175 120 187" fill="none" stroke="#b88d59" stroke-width="3" stroke-dasharray="6 7"/><text x="160" y="278" text-anchor="middle" font-size="15" fill="#53645a">דחיפה מהקרח ויצירת תנע זוויתי</text></g>
<g transform="translate(440 125)"><rect width="320" height="300" rx="18" fill="#e1dccf" stroke="#d0c8b8"/><text x="160" y="38" text-anchor="middle" font-size="21" fill="#a34e36" font-weight="700">02 · סיבוב באוויר</text><circle cx="160" cy="94" r="19" fill="#a34e36"/><path d="M150 118L139 181L177 184L175 127Z" fill="#294638"/><path d="M147 130L126 153M174 130L194 151" stroke="#294638" stroke-width="13" stroke-linecap="round"/><path d="M145 181L129 232M174 183L191 229" stroke="#294638" stroke-width="14" stroke-linecap="round"/><path d="M111 153Q160 105 208 153" fill="none" stroke="#b88d59" stroke-width="3" stroke-dasharray="6 6"/><path d="M92 204A78 78 0 0 1 230 204" fill="none" stroke="#a34e36" stroke-width="3"/><path d="M216 188L230 204L210 210" fill="none" stroke="#a34e36" stroke-width="3"/><text x="160" y="278" text-anchor="middle" font-size="15" fill="#53645a">קירוב הגפיים מקטין מומנט התמד</text></g>
<g transform="translate(810 125)"><rect width="320" height="300" rx="18" fill="#e1dccf" stroke="#d0c8b8"/><text x="160" y="38" text-anchor="middle" font-size="21" fill="#a34e36" font-weight="700">03 · נחיתה</text><circle cx="157" cy="93" r="19" fill="#a34e36"/><path d="M148 118L138 181L178 185L177 128Z" fill="#294638"/><path d="M147 132L87 91M174 132L236 93" stroke="#294638" stroke-width="13" stroke-linecap="round"/><path d="M143 182L111 236M175 184L218 230" stroke="#294638" stroke-width="14" stroke-linecap="round"/><path d="M98 240L143 240" stroke="#a34e36" stroke-width="5" stroke-linecap="round"/><path d="M205 234L248 234" stroke="#a34e36" stroke-width="5" stroke-linecap="round"/><path d="M76 166Q157 205 246 166" fill="none" stroke="#b88d59" stroke-width="3" stroke-dasharray="6 6"/><text x="160" y="278" text-anchor="middle" font-size="15" fill="#53645a">פתיחת הגוף מסייעת לבלום ולייצב</text></g>
<text x="600" y="474" text-anchor="middle" font-size="25" fill="#294638" font-weight="700">L = I × ω</text><text x="600" y="505" text-anchor="middle" font-size="15" fill="#53645a">תנע זוויתי = מומנט התמד × מהירות זוויתית</text><path d="M60 540H1140" stroke="#c5a16b" stroke-width="2"/><text x="1120" y="585" text-anchor="end" font-size="22" fill="#294638" font-weight="700">פיונגצ'אנג 2018 · התוכנית החופשית</text><text x="1120" y="625" text-anchor="end" font-size="16" fill="#53645a">אותו ניקוד כולל, שני מסלולים שונים:</text><text x="1120" y="670" text-anchor="end" font-size="17" fill="#294638">מדבדבה: 79.18 טכני + 77.47 רכיבי תוכנית = 156.65</text><text x="1120" y="710" text-anchor="end" font-size="17" fill="#294638">זגיטובה: 81.62 טכני + 75.03 רכיבי תוכנית = 156.65</text>
</g><text x="70" y="735" font-family="Heebo,Arial,sans-serif" font-size="13" fill="#8a6d3b">המחשה לימודית מקורית; הנתונים מבוססים על טבלת התוצאות הרשמית של ISU.</text>
</svg>