<title id="title">הגוף בתוך המים: תנועה ומדידה</title>
<desc id="desc">איור המחשה רעיוני של שחיין במסלול, גלי מים, קווי תנועה וסימוני מדידה. אין זה צילום או שחזור של ברוך פרצמן.</desc>
