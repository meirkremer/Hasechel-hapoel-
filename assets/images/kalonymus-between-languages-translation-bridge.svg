  <rect x="455" y="145" width="290" height="400" rx="18" fill="url(#green)"/>
  <rect x="825" y="175" width="290" height="340" rx="18" fill="#f8f4eb" stroke="#c8bda9" stroke-width="2"/>
</g>
<g fill="#294638" font-family="Noto Serif Hebrew,serif" text-anchor="middle">
