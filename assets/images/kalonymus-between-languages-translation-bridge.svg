  <text x="600" y="275" font-size="17" opacity=".85">מושג · פירוש · בחירה</text>
  <path d="M520 335h160" stroke="#c5a16b" stroke-width="2"/>
  <text x="600" y="385" font-size="42">קולמוס</text>
  <text x="600" y="435" font-size="18" opacity=".9">לא העתקה בלבד</text>
  <text x="600" y="470" font-size="18" opacity=".9">אלא עיצוב מחדש של ידע</text>
</g>
