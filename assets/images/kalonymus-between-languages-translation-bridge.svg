<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">גשר התרגום בין ערבית, עברית ולטינית</title>
<desc id="desc">איור סמלי של שולחן מתרגם המחבר שלושה כתבים ושלוש לשונות, ללא שחזור של כתב יד היסטורי.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e7dfd0"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#385b49"/><stop offset="1" stop-color="#203c30"/></linearGradient>
  <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1" fill="#8b806c" opacity=".15"/><path d="M14 20l5-2" stroke="#8b806c" opacity=".12"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#40372b" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#paper)"/>
<rect width="1200" height="760" fill="url(#grain)"/>
<path d="M0 570 C230 505 370 640 600 570 S960 500 1200 570" fill="none" stroke="#c5a16b" stroke-width="2" opacity=".5"/>
