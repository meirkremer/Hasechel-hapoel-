<title id="title">החלקה אמנותית בין תנועה למדידה</title>
<desc id="desc">איור מערכתי של מחליקה בתנוחה סיבובית על משטח קרח מופשט, מוקפת בקשתות תנועה, סימני מדידה וקווי מסלול.</desc>
