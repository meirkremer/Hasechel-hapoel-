<text x="600" y="124" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#68736c">מודל אפשרי של שרשרת הייצור המשתקפת במטען Dor L2</text>
<g transform="translate(900 190)">
