  <text x="115" y="370" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="24" font-weight="700" fill="#294638">1 · כור התכה</text>
  <text x="115" y="402" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#53605a">עפרה + פחם + אוויר</text>
  <text x="115" y="429" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#8a6d3b">כ־1,200°C</text>
</g>
