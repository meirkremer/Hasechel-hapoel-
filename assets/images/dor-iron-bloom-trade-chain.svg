  <path d="M162 84 L205 43 L223 61 L180 104 Z" fill="#8a6d3b" stroke="#5e625d" stroke-width="3"/>
  <path d="M87 160 C70 136 89 112 102 97 C112 118 119 135 109 154" fill="none" stroke="#a34e36" stroke-width="5" stroke-linecap="round"/>
  <path d="M202 176 L222 163 M210 188 L236 188 M199 194 L214 213" stroke="#c5a16b" stroke-width="3" stroke-linecap="round"/>
  <text x="135" y="300" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="24" font-weight="700" fill="#294638">4 · בית מלאכה</text>
  <text x="135" y="332" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#53605a">דחיסה, חישול ועיצוב</text>
  <text x="135" y="359" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#8a6d3b">כלים ומוצרים</text>
</g>
<rect x="225" y="530" width="750" height="105" rx="5" fill="#e8e0d1" stroke="#c5b79f"/>
<text x="600" y="570" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="21" font-weight="700" fill="#294638">מה מלמד הממצא מדור?</text>
<text x="600" y="606" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#53605a">אפשר להפריד בין מקום ההתכה, מקום העיבוד ומקום המסחר — אך המסלול המדויק אינו ידוע.</text>
<text x="600" y="685" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="13" fill="#8a8172">תרשים מושגי מקורי · לא תוכנית ארכאולוגית ולא שחזור של כלי שיט היסטורי</text>
</svg>