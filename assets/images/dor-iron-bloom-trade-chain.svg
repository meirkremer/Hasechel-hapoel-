<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">שרשרת הייצור והמסחר של גושי הברזל מלגונת דור</title>
<desc id="desc">תרשים סכמטי מקורי המציג כור התכה, גוש ברזל גולמי עם סיגים, הובלה ימית ועיבוד בבית מלאכה.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f3eb"/><stop offset="1" stop-color="#e8e0d1"/></linearGradient>
  <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e625d"/><stop offset=".55" stop-color="#292f2c"/><stop offset="1" stop-color="#151b19"/></linearGradient>
  <linearGradient id="slag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5a16b"/><stop offset="1" stop-color="#80664b"/></linearGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2a15a"/><stop offset="1" stop-color="#a34e36"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#a34e36" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#paper)"/>
