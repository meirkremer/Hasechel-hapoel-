  <text x="140" y="302" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="17" fill="#53605a">ברזל נקבובי וסיגים</text>
  <text x="140" y="329" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#8a6d3b">עדיין לא חושל</text>
</g>
<path d="M575 360 H490" stroke="#a34e36" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
