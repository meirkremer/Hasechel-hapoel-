 <text x="1510" y="286" text-anchor="end" font-size="18">יסוד נדיר בקרום כדור הארץ, שכיח יחסית בחומר מטאוריטי</text>
 <text x="1510" y="435" text-anchor="end" font-size="25" font-weight="700">כדוריות פגיעה</text>
