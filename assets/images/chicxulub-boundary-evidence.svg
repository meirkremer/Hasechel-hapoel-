<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">שכבת גבול קרטיקון–פלאוגן וסימני הפגיעה</title>
<desc id="d">חתך סטרטיגרפי סכמטי המציג שכבות סלע מתחת ומעל גבול ההכחדה, שכבה דקה עשירה באירידיום, כדוריות פגיעה וגרגרי קוורץ שעברו הלם.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#e7e4d9"/><stop offset="1" stop-color="#f3efe6"/></linearGradient>
 <pattern id="fine" width="26" height="18" patternUnits="userSpaceOnUse"><path d="M0 8 H26" stroke="#6c695f" stroke-width="2" opacity=".25"/></pattern>
 <pattern id="coarse" width="42" height="30" patternUnits="userSpaceOnUse"><circle cx="9" cy="8" r="4" fill="#625e54" opacity=".3"/><circle cx="29" cy="21" r="5" fill="#625e54" opacity=".25"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="1500" y="95" font-family="Assistant,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="end" fill="#283b36">מה נשאר בשכבות הסלע?</text>
<text x="1500" y="138" font-family="Assistant,Arial,sans-serif" font-size="20" text-anchor="end" fill="#6b6d64">חתך מושגי של גבול קרטיקון–פלאוגן · לא בקנה מידה</text>
