<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">המסדרון הצפוני ממומבסה לאוגנדה</title>
<desc id="desc">תרשים מקורי סכמטי של נתיב מסחר מן הנמל במומבסה דרך ניירובי ומעבר מלבה אל קמפלה שבאוגנדה.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f5ee"/><stop offset="1" stop-color="#e8e1d4"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12Z" fill="#a34e36"/></marker>
</defs>
<rect width="1200" height="660" fill="url(#bg)"/>
<text x="1100" y="70" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="18" fill="#9b684b" letter-spacing="2">השכל הפועל · המחשה מקורית</text>
<text x="1100" y="125" text-anchor="end" direction="rtl" font-family="Noto Serif Hebrew,Georgia,serif" font-size="42" font-weight="700" fill="#20251f">הדרך אל הים עוברת דרך שכנים</text>
<text x="1100" y="165" text-anchor="end" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="20" fill="#687168">המסדרון הצפוני: נמל, גבול, כבישים ומסילות — מערכת אזורית אחת</text>
