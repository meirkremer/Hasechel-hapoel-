  <text x="75" y="213" text-anchor="middle" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#687168">נמל ימי בקניה</text>
</g>
<g font-family="Assistant,Arial,sans-serif" text-anchor="middle" direction="rtl">
  <g><circle cx="420" cy="435" r="37" fill="#f8f5ee" stroke="#294638" stroke-width="4"/><text x="420" y="500" font-family="Noto Serif Hebrew,Georgia,serif" font-size="26" font-weight="700" fill="#20251f">ניירובי</text><text x="420" y="528" font-size="16" fill="#687168">מרכז אזורי</text></g>
  <g><circle cx="690" cy="395" r="37" fill="#f8f5ee" stroke="#294638" stroke-width="4"/><text x="690" y="460" font-family="Noto Serif Hebrew,Georgia,serif" font-size="26" font-weight="700" fill="#20251f">מלבה</text><text x="690" y="488" font-size="16" fill="#687168">מעבר גבול</text></g>
  <g><circle cx="1010" cy="390" r="55" fill="#294638" stroke="#c5a16b" stroke-width="5"/><text x="1010" y="386" font-family="Noto Serif Hebrew,Georgia,serif" font-size="29" font-weight="700" fill="#f8f5ee">קמפלה</text><text x="1010" y="417" font-size="16" fill="#e4d9c7">אוגנדה</text></g>
