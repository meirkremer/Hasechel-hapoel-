<text x="600" y="625" text-anchor="middle" direction="rtl" font-family="Assistant,Arial,sans-serif" font-size="16" fill="#73766c">המחשה סכמטית בלבד — לא מפה מדויקת ולא מסלול יחיד</text>
</svg>