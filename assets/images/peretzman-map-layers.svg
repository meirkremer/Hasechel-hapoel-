<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">המפה כשכבות של החלטות</title>
<desc id="desc">תרשים המחשה של מפה המשלבת קווי גובה, דרכים, חלוקת חלקות, נחל ושמות מקומות. זהו תרשים בדיוני ולא מפה של אזור אמיתי.</desc>
