<g font-family="Assistant, Arial, sans-serif" fill="#243b31" direction="rtl"><text x="1480" y="100" text-anchor="end" font-size="38" font-weight="700">המפה אינה רק נוף</text><text x="1480" y="150" text-anchor="end" font-size="23">היא שכבות של החלטות</text><text x="540" y="180" font-size="24">דרך ראשית</text><text x="970" y="730" font-size="24">נחל</text><text x="350" y="680" font-size="22" fill="#a34e36">גבול חלקה</text><text x="1190" y="430" font-size="22">שם מקום</text></g>
