<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">כתובת תל דן — המחשה של הרצף בית דוד</title>
<desc id="desc">איור סכמטי של שבר מצבת בזלת עתיקה עם שורות כתובת ארמית, כאשר הרצף המתועתק BYTDWD מודגש לצד הקריאה המקובלת בית דוד.</desc>
