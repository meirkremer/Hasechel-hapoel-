<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">רשת נישואים בין שושלות חסידיות</title>
<desc id="d">תרשים חלקי של קשרי נישואים שנרשמו במחקר בין דינוב לרופשיץ, רופשיץ לצאנז, צאנז לאוהעל, צ'רנוביל לסדיגורה וצ'רנוביל לאפט מז'יבוז'.</desc>
