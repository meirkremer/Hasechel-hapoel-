name: Deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Probe Hebrew Wikipedia random API (temporary)
        run: |
          if curl --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 45 -fsSL -H 'User-Agent: HasechelHapoelMagazine/1.0' 'https://he.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=20&format=json' -o /tmp/wiki-random.json; then
            echo 'WIKIPEDIA_RANDOM_JSON_BEGIN'
            cat /tmp/wiki-random.json
            echo 'WIKIPEDIA_RANDOM_JSON_END'
          else
            echo 'WIKIPEDIA_RANDOM_API_PROBE_FAILED'
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
