<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/brand-symbol.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/brand-symbol.svg' | relative_url }}">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Noto+Serif+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v=20261126-6">
</head>
<body>
  <div class="edition-bar"><div><span>ידע · תרבות · מחשבה</span><span class="edition-date">מהדורה מתעדכנת <i>·</i> {{ site.time | date: "%d.%m.%Y" }}</span></div></div>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="השכל הפועל — עמוד הבית">
      <img class="brand-symbol" src="{{ '/assets/images/brand-tree.svg' | relative_url }}" alt="" aria-hidden="true">
      <span class="brand-name">השכל הפועל</span>
    </a>
    <nav aria-label="ניווט ראשי">
      <a href="{{ '/' | relative_url }}">המהדורה</a>
      {% for sector in site.data.sectors %}
        <a href="{{ '/sectors/' | append: sector.slug | append: '.html' | relative_url }}">{{ sector.title }}</a>
      {% endfor %}
    </nav>
    <a class="header-link" href="{{ '/' | relative_url }}">לגלות משהו חדש <span>←</span></a>
  </header>
  <main>{{ content }}</main>
  <footer>
    <a class="footer-brand" href="{{ '/' | relative_url }}">השכל הפועל<small>ידע · תרבות · מחשבה</small></a>
    <p>מרחב תוכן עצמאי לסקרנות רצינית.</p>
    <span>© {{ site.time | date: "%Y" }} השכל הפועל</span>
  </footer>
</body>
</html>
